name: Academy prototype smoke tests

on:
  push:
    branches: [develop]
    paths:
      - "student-hub.html"
      - "tests/student-hub-smoke.cjs"
      - ".github/workflows/academy-smoke.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "student-hub.html"
      - "tests/student-hub-smoke.cjs"
      - ".github/workflows/academy-smoke.yml"

permissions:
  contents: read

jobs:
  prototype-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Student Hub and DAW prototype
        run: node tests/student-hub-smoke.cjs
